<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Parta</title>
    <meta name="description" content="Parta — онлайн-подготовка для школьников 1–11 классов: уроки, практика и тесты. Русский и узбекский языки." />
    <meta name="theme-color" content="#3b5bff" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Parta — онлайн-подготовка для школьников" />
    <meta property="og:description" content="Уроки, практика и тесты для 1–11 классов. Решатель, график, калькулятор. Русский и узбекский." />
    <meta property="og:locale" content="ru_RU" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🎓</text></svg>" />
    <style>
      :root {
        --bg: #eef2fa;
        --ink: #101a3d;
        --card: rgba(255, 255, 255, 0.75);
        --line: #d3dbef;
        --brand: #3b5bff;
        --muted: #55618c;
        --hd: "Unbounded", "Trebuchet MS", sans-serif;
        --bd: "Onest", system-ui, sans-serif;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d1230;
          --ink: #eaf0ff;
          --card: rgba(255, 255, 255, 0.07);
          --line: #26305e;
          --muted: #9aa7d6;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0d1230;
        --ink: #eaf0ff;
        --card: rgba(255, 255, 255, 0.07);
        --line: #26305e;
        --muted: #9aa7d6;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: 70px;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.55 var(--bd);
        transition: background 0.3s;
      }
      h1,
      h2,
      h3 {
        font-family: var(--hd);
        line-height: 1.15;
        margin: 0 0 0.5em;
        font-weight: 700;
      }
      a {
        color: inherit;
      }
      button {
        font: inherit;
        cursor: pointer;
        color: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--brand);
        outline-offset: 2px;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 9;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        padding: 10px 4vw;
        background: var(--card);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
      }
      .logo {
        font: 700 20px var(--hd);
        text-decoration: none;
        margin-right: auto;
      }
      nav {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      nav a {
        padding: 6px 12px;
        border-radius: 99px;
        text-decoration: none;
      }
      nav a:hover {
        background: var(--line);
      }
      .btn {
        border: 0;
        border-radius: 12px;
        padding: 10px 18px;
        background: var(--brand);
        color: #fff;
        font-weight: 600;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
        transition:
          transform 0.1s,
          box-shadow 0.1s;
      }
      .btn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
      }
      .btn.ghost {
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--line);
        box-shadow: none;
      }
      .seg {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 99px;
        overflow: hidden;
      }
      .seg button {
        border: 0;
        background: none;
        padding: 6px 12px;
      }
      .seg .on {
        background: var(--brand);
        color: #fff;
      }
      main {
        padding: 0 4vw 60px;
        max-width: 1200px;
        margin: auto;
        animation: in 0.35s;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      .hero {
        position: relative;
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        align-items: center;
        min-height: 520px;
        gap: 20px;
      }
      .hero h1 {
        font-size: clamp(30px, 5vw, 56px);
      }
      .hero p {
        max-width: 46ch;
        color: var(--muted);
        font-size: 18px;
      }
      #h3d {
        height: 460px;
        width: 100%;
      }
      #h3d.flat::after {
        content: "📚🌍✏️🎓";
        font-size: 64px;
        display: block;
        text-align: center;
        padding-top: 150px;
      }
      section {
        margin: 56px 0;
      }
      .grades {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 12px;
      }
      .g {
        aspect-ratio: 1;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: var(--card);
        font: 700 28px var(--hd);
        box-shadow: 0 6px 0 var(--line);
        transition: 0.15s;
      }
      .g:hover,
      .g.on {
        transform: translateY(-4px);
        background: var(--brand);
        color: #fff;
        box-shadow: 0 10px 0 rgba(0, 0, 0, 0.2);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 18px;
        perspective: 900px;
      }
      .card {
        position: relative;
        display: block;
        text-align: left;
        padding: 20px;
        border-radius: 22px;
        background: var(--card);
        border: 1px solid var(--line);
        backdrop-filter: blur(8px);
        box-shadow: 0 18px 30px -18px rgba(16, 26, 61, 0.45);
        transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
        transition: transform 0.15s;
        text-decoration: none;
        border-top: 5px solid var(--c, var(--brand));
      }
      .ico {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        font-size: 32px;
        background: linear-gradient(145deg, var(--c), #0003);
        box-shadow: 0 10px 18px -6px var(--c);
        transform: translateZ(30px);
      }
      .card h3 {
        font-size: 17px;
        margin: 14px 0 4px;
      }
      .muted {
        color: var(--muted);
      }
      .bar {
        height: 8px;
        background: var(--line);
        border-radius: 9px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--c, var(--brand));
        transition: width 0.4s;
      }
      .three {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 18px;
      }
      .box {
        padding: 20px;
        border-radius: 20px;
        background: var(--card);
        border: 1px solid var(--line);
      }
      .step {
        font: 700 34px var(--hd);
        color: var(--brand);
      }
      details {
        border-bottom: 1px solid var(--line);
        padding: 12px 0;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 11px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        margin: 4px 0 10px;
      }
      .tools {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 16px 0;
      }
      .tools input {
        max-width: 280px;
        margin: 0;
      }
      .course {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 20px;
      }
      .les {
        display: flex;
        gap: 10px;
        width: 100%;
        text-align: left;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        margin-bottom: 8px;
      }
      .les.on {
        border-color: var(--c);
        box-shadow: inset 4px 0 var(--c);
      }
      .video {
        aspect-ratio: 16/9;
        border-radius: 18px;
        background: linear-gradient(135deg, var(--c), #101a3d);
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 56px;
        border: 0;
        width: 100%;
        position: relative;
      }
      .video i {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 6px;
        background: #fff;
        width: 0;
      }
      .video.play i {
        animation: pl 8s linear forwards;
      }
      @keyframes pl {
        to {
          width: 100%;
        }
      }
      .opt {
        display: block;
        width: 100%;
        text-align: left;
        padding: 12px 14px;
        margin: 8px 0;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
      }
      .opt.ok {
        background: #1fb86b;
        color: #fff;
      }
      .opt.no {
        background: #e5484d;
        color: #fff;
      }
      .badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 99px;
        background: var(--card);
        border: 1px solid var(--line);
        margin: 4px;
      }
      .badge.off {
        opacity: 0.4;
      }
      dialog {
        border: 0;
        border-radius: 20px;
        background: var(--bg);
        color: var(--ink);
        width: min(380px, 92vw);
        padding: 24px;
      }
      dialog::backdrop {
        background: #0008;
      }
      .err {
        color: #e5484d;
        font-size: 14px;
        min-height: 1.2em;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        padding: 10px 18px;
        border-radius: 99px;
        opacity: 0;
        pointer-events: none;
        transition: 0.3s;
      }
      #toast.on {
        opacity: 1;
      }
      footer {
        padding: 30px 4vw;
        text-align: center;
        color: var(--muted);
        border-top: 1px solid var(--line);
      }
      @media (max-width: 800px) {
        .hero,
        .course {
          grid-template-columns: 1fr;
        }
        #h3d {
          height: 300px;
        }
        .hero {
          min-height: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    
      :root{color-scheme:light dark}
      :root[data-theme="light"]{color-scheme:light}
      :root[data-theme="dark"]{color-scheme:dark}
      h1,h2,h3{text-wrap:balance}
      #app{min-height:60vh}#app:focus{outline:none}
      .skip{position:absolute;left:-999px;top:0;z-index:20;background:var(--brand);color:#fff;padding:10px 16px;border-radius:0 0 12px 0}
      .skip:focus{left:0}
      nav a[aria-current="page"]{background:var(--line);font-weight:600}
      #auth{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      a.btn{display:inline-block;text-decoration:none}
      .btn:disabled{opacity:.5;cursor:default}
      .card{transform-style:preserve-3d}
      @media (hover:none){.card{transform:none}}
      .opt{display:flex;gap:10px;align-items:center;transition:background .15s,border-color .15s}
      .opt:not(:disabled):hover{border-color:var(--brand)}
      .opt:disabled{cursor:default}
      .opt.ok{background:#0f8a4f}.opt.no{background:#d03238}
      .les{align-items:flex-start}
      .course>div:first-child{position:sticky;top:76px;align-self:start}
      .video{cursor:pointer}
      .nav2{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
      .qbar{margin:8px 0 18px}
      dialog label{display:block;margin-top:6px}
      dialog .btn{margin:6px 8px 0 0}
      @media (max-width:800px){.course>div:first-child{position:static}}
    
      @media (max-width:560px){header{gap:6px}nav{order:5;width:100%}#auth{max-width:130px}}
      @media print{header,footer,.video,.nav2,#toast,.skip{display:none!important}body{background:#fff;color:#000}}
    
      .btn:hover{filter:brightness(1.08)}
      .course p{max-width:68ch}
      @media (max-width:640px){
        header{gap:8px}
        nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto}
        nav a{white-space:nowrap}
        #auth{max-width:140px}
      }
    
      .chip{font-weight:600;padding:6px 10px;border-radius:999px;background:var(--line);white-space:nowrap;font-size:14px}
    
      /* ===== Premium theme: liquid glass, living gradients ===== */
      :root{
        --bg:#eef3fb;--ink:#0e1740;--muted:#4f5b8a;--brand:#4f63ff;--line:rgba(80,95,170,.18);
        --card:rgba(255,255,255,.52);--ma:.3;
        --grad:linear-gradient(135deg,#2f55e6 0%,#2f7bf0 55%,#1aa6c4 100%);
        --glass:rgba(255,255,255,.5);--glass-b:rgba(255,255,255,.7);
        --glass-sh:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.25),0 12px 40px -14px rgba(40,55,140,.38);
      }
      @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
        --bg:#070b22;--ink:#eef2ff;--muted:#a3b0e0;--line:rgba(255,255,255,.12);--card:rgba(255,255,255,.07);--ma:.45;
        --glass:rgba(255,255,255,.08);--glass-b:rgba(255,255,255,.18);
        --glass-sh:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04),0 14px 44px -14px rgba(0,0,0,.65);}}
      :root[data-theme="dark"]{
        --bg:#070b22;--ink:#eef2ff;--muted:#a3b0e0;--line:rgba(255,255,255,.12);--card:rgba(255,255,255,.07);--ma:.45;
        --glass:rgba(255,255,255,.08);--glass-b:rgba(255,255,255,.18);
        --glass-sh:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04),0 14px 44px -14px rgba(0,0,0,.65);}
      html{scroll-padding-top:96px;scroll-behavior:smooth}
      body{background:var(--bg);overflow-x:hidden}
      body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;filter:blur(24px);
        background:
          radial-gradient(38% 34% at 14% 18%,rgba(47,85,230,calc(var(--ma) * .9)),transparent 70%),
          radial-gradient(34% 34% at 86% 12%,rgba(58,134,255,calc(var(--ma) * .7)),transparent 70%),
          radial-gradient(40% 40% at 78% 86%,rgba(34,211,238,calc(var(--ma) * .8)),transparent 70%),
          radial-gradient(34% 34% at 8% 88%,rgba(26,166,196,calc(var(--ma) * .6)),transparent 70%);
        animation:drift 24s ease-in-out infinite alternate}
      @keyframes drift{to{transform:translate3d(3%,-3%,0) scale(1.1) rotate(3deg)}}
      /* glass surfaces */
      header,.card,.box,.les,.opt,.badge,.chip,.seg,.btn.ghost,.g,dialog,#toast,input,.tools input{
        -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
      header{top:calc(10px + env(safe-area-inset-top,0px));margin:10px 3vw 0;padding:8px 14px;border-radius:26px;
        background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--glass-sh)}
      .logo{background:linear-gradient(135deg,#4a74ff,#19b5d1);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.02em}
      nav a{transition:background .2s,color .2s}
      nav a:hover{background:rgba(255,255,255,.35)}
      nav a[aria-current="page"]{background:var(--grad);color:#fff;font-weight:600;box-shadow:0 6px 16px -6px rgba(47,85,230,.6)}
      .chip{background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--glass-sh)}
      .seg{background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--glass-sh)}
      .seg .on{background:var(--grad);color:#fff}
      .btn{background:var(--grad);border-radius:16px;padding:11px 20px;position:relative;overflow:hidden;
        box-shadow:0 12px 26px -10px rgba(47,85,230,.65),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,filter .2s}
      .btn::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
      .btn:hover{filter:none;transform:translateY(-2px);box-shadow:0 18px 32px -12px rgba(47,85,230,.75),inset 0 1px 0 rgba(255,255,255,.55)}
      .btn:hover::after{transform:translateX(120%)}
      .btn:active{transform:translateY(0) scale(.98)}
      .btn.ghost{background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--glass-sh);color:var(--ink)}
      .btn.ghost:hover{box-shadow:var(--glass-sh),0 14px 28px -14px rgba(79,99,255,.6)}
      /* hero */
      .hero h1{color:var(--ink);letter-spacing:-.025em;padding-bottom:.08em}
      .hero p{font-size:19px}
      section>h2,main>h2{position:relative}
      section>h2::after{content:"";display:block;width:56px;height:5px;border-radius:5px;background:var(--grad);margin-top:10px}
      /* grade tiles */
      .g{border-radius:22px;background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--glass-sh);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,background .25s}
      .g:hover,.g.on{background:var(--grad);color:#fff;border-color:transparent;transform:translateY(-5px) scale(1.04);box-shadow:0 18px 34px -12px rgba(47,85,230,.6),inset 0 1px 0 rgba(255,255,255,.5)}
      /* cards */
      .card{border-radius:26px;border:1px solid var(--glass-b);border-top:1px solid var(--glass-b);overflow:hidden;
        background:radial-gradient(120% 90% at 0 0,color-mix(in srgb,var(--c,#4f63ff) 24%,transparent),transparent 62%),var(--glass);
        box-shadow:var(--glass-sh);transition:transform .2s,box-shadow .3s}
      .card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,0) 38%)}
      .card:hover{box-shadow:var(--glass-sh),0 28px 50px -22px var(--c,#4f63ff)}
      .ico{border-radius:20px;box-shadow:0 14px 22px -8px var(--c),inset 0 1px 0 rgba(255,255,255,.6)}
      .box{border-radius:24px;background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--glass-sh)}
      .les{border-radius:16px;background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--glass-sh);transition:transform .2s,box-shadow .2s}
      .les:hover{transform:translateX(3px)}
      .les.on{background:linear-gradient(90deg,color-mix(in srgb,var(--c,#4f63ff) 22%,transparent),var(--glass) 70%);border-color:var(--c);box-shadow:var(--glass-sh),inset 4px 0 var(--c)}
      .opt{border-radius:16px;background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--glass-sh);transition:transform .15s,border-color .2s,background .2s}
      .opt:not(:disabled):hover{transform:translateY(-2px);border-color:var(--brand)}
      .opt.ok{background:linear-gradient(135deg,#19b36b,#0f8a4f);color:#fff;border-color:transparent;box-shadow:0 12px 24px -10px rgba(15,138,79,.8)}
      .opt.no{background:linear-gradient(135deg,#f0565b,#d03238);color:#fff;border-color:transparent;box-shadow:0 12px 24px -10px rgba(208,50,56,.8)}
      .badge{background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--glass-sh)}
      .bar{height:10px;background:rgba(120,135,200,.2);box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
      .bar i{background:linear-gradient(90deg,var(--c,#4f63ff),color-mix(in srgb,var(--c,#4f63ff) 60%,#1aa6c4));box-shadow:0 0 14px var(--c,#4f63ff);border-radius:9px}
      .video{border-radius:24px;background:linear-gradient(135deg,var(--c),#0e1740);box-shadow:0 24px 44px -20px var(--c),inset 0 1px 0 rgba(255,255,255,.35)}
      input,.tools input{background:var(--glass);border:1px solid var(--glass-b);border-radius:14px;padding:12px 14px;box-shadow:inset 0 1px 2px rgba(0,0,0,.06);transition:border-color .2s,box-shadow .2s}
      input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,99,255,.25)}
      .step{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
      /* dialog and toast */
      dialog{border-radius:30px;background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--glass-sh),0 40px 80px -20px rgba(0,0,0,.5);-webkit-backdrop-filter:blur(36px) saturate(190%);backdrop-filter:blur(36px) saturate(190%)}
      dialog[open]{animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
      dialog::backdrop{background:rgba(10,15,50,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
      @keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}}
      #toast{background:rgba(14,23,64,.78);color:#fff;border:1px solid rgba(255,255,255,.2);box-shadow:0 18px 40px -12px rgba(0,0,0,.5)}
      footer{border-top:1px solid var(--line);background:var(--glass)}
      /* entrance */

      const partaLocalMode = true; // GitHub Pages is static; edits are browser-local.
      async function partaHash(value) {
        const bytes = new TextEncoder().encode(value);
        const digest = await crypto.subtle.digest('SHA-256', bytes);
        return Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2, '0')).join('');
      }
      async function partaLocalLogin(code, uz) {
        const saved = localStorage.getItem('parta_local_password_hash');
        if (!saved) {
          const repeat = prompt(uz ? 'Parolni qayta kiriting:' : 'Повторите новый пароль:');
          if (!repeat || repeat !== code) { alert(uz ? 'Parollar mos kelmadi.' : 'Пароли не совпадают.'); return false; }
          localStorage.setItem('parta_local_password_hash', await partaHash(code));
          alert(uz ? 'Mahalliy parol yaratildi. Bu faqat ushbu brauzer uchun.' : 'Локальный пароль создан. Он действует только в этом браузере.');
          return true;
        }
        const valid = await partaHash(code) === saved;
        if (!valid) alert(uz ? 'Parol noto‘g‘ri.' : 'Неверный пароль.');
        return valid;
      }
      async function partaToggleEditor() {
        const url = new URL(window.location.href);
        if (url.searchParams.has('admin')) {
          sessionStorage.removeItem('parta_editor_code');
          url.searchParams.delete('admin');
          window.location.assign(url.pathname + url.search + url.hash);
          return;
        }
        const uz = document.documentElement.lang === 'uz';
        const setup = partaLocalMode && !localStorage.getItem('parta_local_password_hash');
        const code = prompt(setup ? (uz ? 'Yangi mahalliy administrator parolini yarating:' : 'Придумайте пароль администратора для локального сайта:') : (uz ? 'Administrator paroli yoki o‘qituvchi kodini kiriting:' : 'Введите пароль администратора или код учителя:'));
        if (!code) return;
        if (partaLocalMode) {
          if (!(await partaLocalLogin(code, uz))) return;
          sessionStorage.setItem('parta_editor_code', code);
          url.searchParams.set('admin', '1');
          window.location.assign(url.pathname + url.search + url.hash);
          return;
        }
        try {
          const res = await fetch('/.GitHub Pages/functions/videos', {
            method: 'POST', headers: {'Content-Type':'application/json','X-Editor-Code':code},
            body: JSON.stringify({action:'verify'})
          });
          if (!res.ok) {
            alert(uz ? 'Parol noto‘g‘ri yoki server sozlanmagan.' : 'Неверный пароль или сервер не настроен.');
            return;
          }
          sessionStorage.setItem('parta_editor_code', code);
          url.searchParams.set('admin', '1');
          window.location.assign(url.pathname + url.search + url.hash);
        } catch (e) {

        }
      }

 if(body.action==='view'){
  const snap=await ref.once('value');if(!snap.exists())throw Error('Комната не найдена или закрыта');return {room:toRoom(body.code,snap.val())};
 }
 if(body.action==='join'){
  const name=String(body.name||'').trim().slice(0,50);if(!name)throw Error('Введите имя ученика');
  const snap=await ref.once('value');if(!snap.exists())throw Error('Комната не найдена');
  await ref.child('students/'+uid).set({name});
  const updated=await ref.once('value');return {room:toRoom(body.code,updated.val()),studentId:uid};
 }
 if(body.action==='close'){
  const snap=await ref.once('value');if(!snap.exists())throw Error('Комната уже закрыта');
  if(snap.val().owner!==uid)throw Error('Закрыть комнату может только её создатель на том же устройстве');
  await ref.remove();return {ok:true};
 }
 throw Error('Неизвестная операция');
}
function render(html){el('parta-rooms-content').innerHTML=html;}
function status(s){el('parta-rooms-status').textContent=s||'';}
function stopRoom(){clearInterval(poll);poll=null;if(chatRef&&chatListener)chatRef.off('value',chatListener);chatRef=null;chatListener=null;}
function home(){stopRoom();room=null;render(`<h2>${t.title}</h2><div class="pr-actions"><button id="pr-teacher">👩‍🏫 ${t.teacher}</button><button id="pr-student">🎓 ${t.student}</button></div>`);el('pr-teacher').onclick=teacher;el('pr-student').onclick=student;status('');}
function teacher(){render(`<h2>${t.create}</h2><p style="font-size:12px;opacity:.8">☁ Firebase · GitHub Pages</p><label>${t.name}<input id="pr-name" maxlength="70" placeholder="7-А — Математика"></label><div class="pr-actions"><button id="pr-create">${t.create}</button><button id="pr-back">${t.back}</button></div>`);el('pr-create').onclick=async()=>{status('');try{const data=await api({action:'create',name:el('pr-name').value},'');room=data.room;ownerToken=data.ownerToken;showRoom(true);}catch(e){status(e.message)}};el('pr-back').onclick=home;}
function student(){render(`<h2>${t.join}</h2><label>${t.code}<input id="pr-code" inputmode="numeric" maxlength="5" placeholder="94210"></label><label>${t.pupil}<input id="pr-pupil" maxlength="50"></label><div class="pr-actions"><button id="pr-join">${t.join}</button><button id="pr-back">${t.back}</button></div>`);el('pr-join').onclick=async()=>{status('');try{const code=el('pr-code').value.trim();const data=await api({action:'join',code,name:el('pr-pupil').value,studentId:sessionStorage.getItem('parta-room-'+code)||''});room=data.room;studentId=data.studentId;sessionStorage.setItem('parta-room-'+code,studentId);showRoom(false);}catch(e){status(e.message)}};el('pr-back').onclick=home;}
function updateChatState(){const entry=el('pr-message'),send=el('pr-send'),notice=el('pr-chat-notice'),toggle=el('pr-toggle-chat');if(!entry)return;const allowed=chatIsTeacher||chatEnabled;entry.disabled=!allowed;send.disabled=!allowed;notice.textContent=allowed?'':t.chatClosed;if(toggle)toggle.textContent=chatEnabled?t.mute:t.unmute;}
function showRoom(isTeacher){
 if(!room)return;stopRoom();chatIsTeacher=isTeacher;chatEnabled=room.chatEnabled!==false;
 render(`<h2>${esc(room.name)}</h2><div class="pr-code">${esc(room.code)}</div><p>${t.hint}</p><div class="pr-actions">${isTeacher?`<button id="pr-copy">${t.copy}</button><button id="pr-close">${t.close}</button>`:''}<button id="pr-back">${t.back}</button></div><h3>${t.members} (<span id="pr-count">${room.students.length}</span>)</h3><ul id="pr-members">${room.students.map(s=>`<li>${esc(s.name)}</li>`).join('')}</ul><h3>${t.chat}</h3><div id="pr-messages" aria-live="polite" style="height:200px;overflow-y:auto;border:1px solid var(--line,#aaa);border-radius:12px;padding:10px;margin:10px 0;background:var(--glass,var(--bg))"></div><p id="pr-chat-notice"></p><form id="pr-chat-form" class="pr-actions"><input id="pr-message" maxlength="500" autocomplete="off" placeholder="${esc(t.message)}" aria-label="${esc(t.message)}" style="flex:1;min-width:130px"><button id="pr-send" type="submit">${t.send}</button></form><div class="pr-actions"><button id="pr-raise">${t.raise}</button>${isTeacher?`<button id="pr-toggle-chat"></button>`:''}</div>`);
 el('pr-back').onclick=home;
 if(isTeacher){el('pr-copy').onclick=()=>navigator.clipboard?.writeText(room.code).then(()=>status('✓ '+room.code)).catch(()=>status(room.code));el('pr-close').onclick=async()=>{try{await api({action:'close',code:room.code,ownerToken});home();}catch(e){status(e.message)}};el('pr-toggle-chat').onclick=async()=>{try{await roomRef(room.code).child('chatEnabled').set(!chatEnabled);}catch(e){status(e.message)}};}
 const uid=firebase.auth().currentUser.uid;
 const send=async(text)=>{text=String(text||'').trim();if(!text||text.length>500)return;if(!chatIsTeacher&&!chatEnabled){status(t.chatClosed);return;}try{await roomRef(room.code).child('messages').push({uid,text,createdAt:firebase.database.ServerValue.TIMESTAMP});el('pr-message').value='';status('');}catch(e){status(e.message)}};
 el('pr-chat-form').onsubmit=e=>{e.preventDefault();send(el('pr-message').value)};
 el('pr-raise').onclick=()=>send('✋');
 chatRef=roomRef(room.code).child('messages').limitToLast(80);
 chatListener=snapshot=>{const target=el('pr-messages');if(!target)return;const messages=[];snapshot.forEach(item=>{const v=item.val()||{};if(typeof v.text==='string')messages.push(v)});target.innerHTML=messages.length?messages.map(m=>{const author=m.uid===uid?(isTeacher?t.teacher:t.student):(room.students.find(st=>st.uid===m.uid)?.name||t.teacher);return `<p style="margin:5px 0;overflow-wrap:anywhere"><strong>${esc(author)}:</strong> ${esc(m.text)}</p>`}).join(''):`<p>${esc(t.chatEmpty)}</p>`;target.scrollTop=target.scrollHeight;};
 chatRef.on('value',chatListener,e=>status(e.message));updateChatState();
 poll=setInterval(async()=>{if(!room||el('parta-rooms-overlay').hidden)return;try{const d=await api({action:'view',code:room.code});room=d.room;el('pr-count').textContent=room.students.length;el('pr-members').innerHTML=room.students.map(s=>`<li>${esc(s.name)}</li>`).join('');chatEnabled=room.chatEnabled!==false;updateChatState();}catch(e){status(e.message);stopRoom()}},4000);
}
function open(){lang();el('parta-rooms-entry').textContent='🏫 '+t.button;el('parta-rooms-overlay').hidden=false;home();}
function init(){const style=document.createElement('style');style.textContent=`#parta-rooms-entry{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;border:1px solid var(--line);border-radius:14px;padding:10px 13px;cursor:pointer;font:inherit;font-weight:650;color:var(--fg,var(--text,inherit));background:var(--glass,var(--bg));box-shadow:var(--glass-sh,0 4px 16px #0001);backdrop-filter:blur(var(--blur,14px));-webkit-backdrop-filter:blur(var(--blur,14px));transition:transform .2s,background .2s}#parta-rooms-entry:hover{transform:translateY(-2px)}#parta-rooms-overlay[hidden]{display:none!important}#parta-rooms-overlay{position:fixed;inset:0;background:rgba(12,20,42,.64);z-index:10002;display:grid;place-items:center;padding:15px;backdrop-filter:blur(8px)}#parta-rooms-dialog{box-sizing:border-box;width:min(100%,480px);max-height:90dvh;overflow:auto;background:var(--glass,var(--bg,#fff));color:var(--fg,var(--text,inherit));border:1px solid var(--glass-b,var(--line,#ddd));border-radius:24px;padding:24px;box-shadow:var(--glass-sh,0 20px 80px #0005);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);font:inherit}#parta-rooms-dialog h2{font-size:23px;margin:0 0 20px}#parta-rooms-dialog label{display:block;margin:12px 0;font-weight:600}#parta-rooms-dialog input{display:block;width:100%;box-sizing:border-box;border:1px solid var(--line,#cbd5e1);background:var(--bg,#fff);color:inherit;border-radius:12px;padding:13px;margin-top:7px;font:inherit}#parta-rooms-dialog button{border:1px solid var(--line,#cbd5e1);border-radius:12px;background:var(--accent,#2563eb);color:#fff;padding:12px 15px;cursor:pointer;font:600 14px system-ui}#parta-rooms-dialog .pr-actions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}#parta-rooms-dialog .pr-code{font-size:46px;letter-spacing:8px;font-weight:800;text-align:center;background:var(--glass,var(--bg));border:1px solid var(--line);border-radius:15px;padding:18px}#parta-rooms-status{color:#e15b64;min-height:20px}#parta-rooms-x{float:right;background:var(--glass,var(--bg))!important;color:inherit!important}@media(max-width:760px){#parta-rooms-entry{padding:8px 10px;font-size:12px;border-radius:12px}#parta-rooms-dialog{padding:18px}}`;document.head.append(style);const b=document.createElement('button');b.id='parta-rooms-entry';b.textContent='🏫 '+(document.documentElement.lang==='uz'?'Xonalar':'Комнаты');b.onclick=open;const admin=el('parta-admin-entry');const header=document.querySelector('header');if(admin&&admin.parentElement){admin.parentElement.insertBefore(b,admin);}else if(header){header.appendChild(b);}else{document.body.prepend(b);}const overlay=document.createElement('div');overlay.id='parta-rooms-overlay';overlay.hidden=true;overlay.innerHTML='<div id="parta-rooms-dialog" role="dialog" aria-modal="true"><button id="parta-rooms-x" aria-label="Close">✕</button><div id="parta-rooms-content"></div><p id="parta-rooms-status" aria-live="polite"></p></div>';document.body.append(overlay);el('parta-rooms-x').onclick=()=>{overlay.hidden=true;stopRoom()};overlay.onclick=e=>{if(e.target===overlay){overlay.hidden=true;stopRoom()}};}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();

</script>
